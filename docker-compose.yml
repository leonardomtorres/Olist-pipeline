services:
  db:
    image: postgres:15
    container_name: olist_postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  pipeline:
    build: ./pipeline
    container_name: olist_pipeline
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./data:/app/data
      - ./pipeline:/app
      
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:latest
    container_name: olist_dbt
    volumes:
      - ./dbt:/usr/app
    working_dir: /usr/app
    depends_on:
      - db
    environment:
      - DBT_PROFILES_DIR=/usr/app




  dashboard:
    build: ./dashboard
    container_name: olist_streamlit
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./dashboard:/app

volumes:
  postgres_data: