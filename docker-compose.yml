version: '3.8'

services:
  db:
    image: postgres:15
    container_name: olist_postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  dashboard:
    build: ./dashboard
    container_name: olist_streamlit
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - db
    volumes:
      - ./dashboard:/app

volumes:
  postgres_data: